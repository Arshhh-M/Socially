name: Build SocialX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android-app/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: gradle --no-daemon -p android-app assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialX-debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
